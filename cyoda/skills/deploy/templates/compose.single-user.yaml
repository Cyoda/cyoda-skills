# single-user: mock auth — anyone who can reach these ports is admin.
# Keep every port on 127.0.0.1. For a team or any shared host, use
# compose.shared.yaml (JWT mode) instead.
#
# Based on deploy/docker/compose.yaml at cyoda-go tag v0.8.4, with the image
# pinned and the upstream commented "production" block removed (it enables
# CYODA_REQUIRE_JWT without CYODA_IAM_MODE=jwt and passes the PEM inline).
# Facts: cyoda help run (RUN MODES: Docker Compose; HEALTH PROBES; PORT LAYOUT).
#
#   docker compose -f compose.yaml up -d
#
# Ports (container -> host): 8080 REST API (/api) -> 18080, 9090 gRPC for
# compute nodes -> 19090, 9091 admin (/livez, /readyz, /metrics) -> 19091.
# The host ports differ from cyoda-go's defaults because the developer's local
# cyoda-go already holds 8080/9090/9091; override with CYODA_HOST_*_PORT.
services:
  cyoda:
    image: ghcr.io/cyoda/cyoda:${CYODA_VERSION:-0.8.4}
    ports:
      - "127.0.0.1:${CYODA_HOST_HTTP_PORT:-18080}:8080"
      - "127.0.0.1:${CYODA_HOST_GRPC_PORT:-19090}:9090"
      - "127.0.0.1:${CYODA_HOST_ADMIN_PORT:-19091}:9091"
    environment:
      CYODA_STORAGE_BACKEND: sqlite
      CYODA_SQLITE_PATH: /var/lib/cyoda/cyoda.db
      CYODA_IAM_MODE: mock
      # Needed in a container so the healthcheck and port 9091 can reach the probes.
      CYODA_ADMIN_BIND_ADDRESS: 0.0.0.0
    volumes:
      - cyoda-data:/var/lib/cyoda
    # `cyoda health` GETs /readyz on the admin port. Raise start_period on slow hosts.
    healthcheck:
      test: ["CMD", "/cyoda", "health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3

volumes:
  cyoda-data:
